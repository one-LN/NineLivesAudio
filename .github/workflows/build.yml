name: Build

on:
  push:
    branches: [master, main, "arena/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static self-check (localization, XAML, DI, packaging)
        run: python3 tools/verify.py

  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to publish the download release below
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore -r win-x64

      - name: Build (Release)
        run: dotnet build -r win-x64 -c Release --no-restore

      - name: Publish (win-x64, self-contained)
        run: dotnet publish -p:PublishProfile=win-x64 -c Release --no-restore

      # Shows up as a notice annotation on the run page: makes the publish layout
      # (and any stray culture folders) reviewable without downloading the artifact.
      # SatelliteResourceLanguages only trims managed *.resources.dll satellites; a
      # self-contained WinUI 3 publish still copies one folder per culture for the
      # Windows App SDK's native MUI files. Drop everything except the two UI languages.
      - name: Trim unused language folders
        shell: pwsh
        run: |
          $keep = @('en', 'zh')
          $root = 'binpublish'
          try {
            $removed = @()
            foreach ($dir in Get-ChildItem $root -Directory) {
              if ($dir.Name -notmatch '^[a-z]{2,3}(-[a-z]{2,4})?$') { continue }
              $language = ($dir.Name -split '-')[0].ToLower()
              if ($keep -contains $language) { continue }
              Remove-Item -LiteralPath $dir.FullName -Recurse -Force -ErrorAction Stop
              $removed += $dir.Name
            }
            if ($removed.Count -gt 0) {
              Write-Host "Removed $($removed.Count) culture folder(s): $($removed -join ', ')"
            } else {
              Write-Host 'No culture folders to remove.'
            }
          }
          catch {
            Write-Error "Language folder trim failed: $($_.Exception.Message)"
          }

      - name: Publish layout summary
        shell: pwsh
        run: |
          $dirs = Get-ChildItem binpublish -Directory | Select-Object -ExpandProperty Name
          $files = (Get-ChildItem binpublish -Recurse -File).Count
          $size = [math]::Round(((Get-ChildItem binpublish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "Layout: $($dirs.Count) folder(s) [$($dirs -join ', ')] · $files files · $size MB"

          # The app ships en-US/zh-CN only. Build/trim-cultures.ps1 removes the rest at
          # publish time; anything culture-shaped that survives is a regression, so fail
          # the build instead of just warning — a green run now proves the package is clean.
          $stray = $dirs | Where-Object { $_ -match '^[a-z]{2,3}(-[a-z]{2,4})?$' -and $_ -notmatch '^(en|zh)(-|$)' }
          if ($stray) {
            Write-Error "Unexpected language folder(s) in publish output: $($stray -join ', ')"
          } else {
            Write-Host "No stray language folders."
          }

      # ── Single-file build ────────────────────────────────────────────────────────
      # WinUI 3 cannot be published with PublishSingleFile (WinAppSDK native DLLs have to be
      # on disk), so the publish output is embedded into a small AOT launcher that unpacks it
      # next to itself on first run. Result: one exe the user can copy anywhere.
      - name: Package payload for the single-file build
        shell: pwsh
        run: Compress-Archive -Path binpublish/* -DestinationPath launcher/payload.zip -Force

      - name: Publish single-file launcher
        shell: pwsh
        run: dotnet publish launcher/NineLivesAudio.Launcher.csproj -c Release -r win-x64 -o launcher_out

      - name: Single-file summary
        shell: pwsh
        run: |
          $exe = 'launcher_out/NineLivesAudio.exe'
          if (-not (Test-Path $exe)) { Write-Error 'launcher_out/NineLivesAudio.exe was not produced'; exit 1 }
          $size = [math]::Round(((Get-Item $exe).Length / 1MB), 1)
          Write-Host "Single file: $exe · $size MB"

      - name: Upload single-file build
        uses: actions/upload-artifact@v4
        with:
          name: NineLivesAudio-single-exe
          path: launcher_out/NineLivesAudio.exe
          if-no-files-found: error
          retention-days: 30

      # Optional: the runner image ships Inno Setup 6, so a setup.exe is produced too.
      # A missing ISCC.exe must not fail the portable build.
      - name: Compile installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $iscc) {
            Write-Host "Inno Setup not found — skipping installer" -ForegroundColor Yellow
            exit 0
          }
          & $iscc "installer.iss"

      - name: Upload portable build (binpublish)
        uses: actions/upload-artifact@v4
        with:
          name: NineLivesAudio-win-x64-portable
          path: binpublish/
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NineLivesAudio-win-x64-installer
          path: installer_output/*.exe
          if-no-files-found: warn
          retention-days: 30

      # A plain download link, no GitHub login required: the artifact above needs a
      # signed-in browser, which is useless if all you want is the installer.
      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path binpublish/* -DestinationPath NineLivesAudio-win-x64-portable.zip -Force

      - name: Publish download release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
        run: |
          set -e
          {
            echo "Automated build of \`$SHA\` from \`$REF\`."
            echo ""
            echo "- **NineLivesAudio.exe** — single file: put it in any folder, double-click; the first start unpacks once."
            echo "- **NineLivesAudio-win-x64-portable.zip** — the same app as a plain folder, if you prefer no unpacking."
            echo "- The installer (NineLivesAudioSetup.exe) is still built as a CI artifact for the Start Menu / uninstall path."
            echo ""
            echo "Every new build replaces the assets of this release."
          } > release-notes.md
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "NineLivesAudio — latest build" --notes-file release-notes.md
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          fi
          gh release upload "$TAG" launcher_out/NineLivesAudio.exe \
            NineLivesAudio-win-x64-portable.zip --clobber --repo "$GITHUB_REPOSITORY"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
