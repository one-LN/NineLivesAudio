name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags:
      - "android-v*"
  pull_request:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Structural Android checks
        run: python3 tools/verify_android.py

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon > "$RUNNER_TEMP/android-build.log" 2>&1 || (tail -n 60 "$RUNNER_TEMP/android-build.log"; exit 1)

      - name: Comment build error on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$RUNNER_TEMP/android-build.log"
          # Surface the actual Kotlin/Java errors, not the final Gradle task lines.
          if [ ! -f "$LOG" ]; then
            echo "::error title=Android build::Gradle log was not created at $LOG"
            exit 0
          fi
          echo "::notice title=Android build::Gradle log size $(wc -c < "$LOG") bytes"
          ERRORS=$(grep -nE '^(e: |w: )|error:|ERROR|FAILURE:|What went wrong|Caused by|Could not' "$LOG" | head -40 || true)
          BODY="$ERRORS"
          [ -z "$BODY" ] && BODY=$(tail -n 80 "$LOG")
          # Public fallback: failure annotations are readable without signing in.
          printf '%s\n' "$BODY" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Gradle::${line//$'%'/%25}"
          done
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="\`\`\`\n$BODY\n\`\`\`" || echo "::warning::Could not post Android build diagnostics"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NineLivesAudio-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NineLivesAudio-android-apk
          path: NineLivesAudio-android.apk

  release-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build-android
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NineLivesAudio-android-apk

      - name: Publish Android prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: NineLivesAudio-android.apk
          make_latest: false
          prerelease: true
